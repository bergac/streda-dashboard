services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: streda
      POSTGRES_USER: streda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - streda-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streda -d streda"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Uncomment to reach the database from your Mac (e.g. with TablePlus or psql):
    # ports:
    #   - "127.0.0.1:5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      STREDA_HOST: ${STREDA_HOST:?Set STREDA_HOST in .env}
      STREDA_MQTT_PORT: ${STREDA_MQTT_PORT:-1883}
      STREDA_MQTT_USERNAME: ${STREDA_MQTT_USERNAME:-}
      STREDA_MQTT_PASSWORD: ${STREDA_MQTT_PASSWORD:-}
      STREDA_BASE_TOPIC: ${STREDA_BASE_TOPIC:-zigbee2mqtt}
      DATABASE_URL: postgres://streda:${POSTGRES_PASSWORD}@db:5432/streda
      TZ: ${TZ:-Europe/Amsterdam}
      MAINS_VOLTAGE: ${MAINS_VOLTAGE:-230}
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-7}
      READINGS_RETENTION_DAYS: ${READINGS_RETENTION_DAYS:-0}
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"

volumes:
  streda-db:
